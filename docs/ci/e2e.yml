# To enable: copy this file to .github/workflows/e2e.yml (pushing workflow files needs a token with
# the "workflow" scope, which the automation token does not have).

name: Dashboard E2E (optional)
# Browser tests for the customer dashboard (Playwright, desktop 1366×800 + mobile 390×844).
# Separate from CI: needs a browser download. Runs the local demo server (e2e/server.js):
# embedded database, READ_ONLY, no Meta writes, no WhatsApp sends — no secrets needed.
on:
  workflow_dispatch:
  pull_request:
    branches: [audit-security-hardening-20261025]
    paths:
      - 'public/**'
      - 'portalRoutes.js'
      - '*Routes.js'
      - 'e2e/**'
      - 'playwright.config.js'
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
