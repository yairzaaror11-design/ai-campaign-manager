name: SCORPIO isolated integration
on:
  push:
    branches: ['integration/scorpio-**']
  pull_request:
    branches: ['integration/scorpio-**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: scorpio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready --health-interval=5s
          --health-timeout=5s --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/scorpio_test
      DB_SSL: 'false'
      READ_ONLY: 'true'
      META_WRITES_ENABLED: 'false'
      WHATSAPP_SEND_ENABLED: 'false'
      SCOPED_AUTOMATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
