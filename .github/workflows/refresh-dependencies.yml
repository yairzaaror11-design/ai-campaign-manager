name: Refresh vulnerable dependencies and verify
on:
  push:
    branches: [audit-security-hardening-20261025]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-security-hardening-20261025
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile from current manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply available security fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Reproducible install
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Security gate - do not ignore high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified dependency lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'fix(deps): regenerate and audit production lockfile'
            git push origin HEAD:audit-security-hardening-20261025
          fi
