services:
  - type: web
    name: campaign-bachat
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: READ_ONLY
        value: "true"
      - key: APPROVAL_TTL_MINUTES
        value: "10"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: META_GRAPH_VERSION
        value: v26.0
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_ADS_ACCESS_TOKEN
        sync: false
      - key: AUTHORIZED_PHONE_NUMBERS
        sync: false
