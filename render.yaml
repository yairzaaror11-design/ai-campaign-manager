services:
  - type: web
    name: ai-campaign-manager
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    branch: audit-security-hardening-20261025
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: META_WRITES_ENABLED
        value: "false"
      - key: WHATSAPP_SEND_ENABLED
        value: "false"
      - key: WHATSAPP_WORKER_IN_WEB
        value: "true"
      - key: META_LEGACY_SINGLE_TENANT
        value: "false"
      - key: AI_PROVIDER
        value: gemini
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: REQUIRE_WORKER_HEARTBEAT
        value: "true"
      - key: DATA_RETENTION_DAYS
        value: "90"
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: APP_PUBLIC_URL
        sync: false
      - key: META_APP_ID
        value: "3244596585929846"
      - key: META_LOGIN_CONFIG_ID
        value: "1547508470739287"
      - key: META_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: APPROVAL_HMAC_KEY
        sync: false
      - key: DELETION_HMAC_KEY
        sync: false
      - key: PRIVACY_OPERATOR_NAME
        value: "קמפיין בצ׳ט"
      - key: PRIVACY_CONTACT_EMAIL
        value: yairdigitalil@gmail.com
      - key: PRIVACY_HOSTING_PROVIDER
        value: Render
      - key: PRIVACY_BACKUP_RETENTION
        sync: false
      - key: READ_ONLY
        value: "true"
      - key: APPROVAL_TTL_MINUTES
        value: "10"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TRANSCRIBE_MODEL
        value: gemini-3.5-transcribe
      - key: META_GRAPH_VERSION
        value: v26.0
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: AUTHORIZED_PHONE_NUMBERS
        sync: false
      - key: TELNYX_PUBLIC_KEY
        sync: false
      - key: TELNYX_SMS_ADMIN_TOKEN
        sync: false
      - key: TELNYX_PHONE_NUMBER
        value: "+12186580186"

# Stage 6: connect an existing PostgreSQL database by setting DATABASE_URL in Render.
# Do not create a paid database automatically from this file.
